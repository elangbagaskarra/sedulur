{% extends "layouts/base.html" %} {% block content %}

<h1 class="page-title mb-4">Tambah Kategori</h1>

<div class="row">
  <div class="col-xl-6">
    <div class="app-card">
      <div class="app-card-body">
        <form method="POST">
          {% csrf_token %}

          <div class="mb-3">
            <label class="form-label"> Nama Kategori </label>

            {{ form.name }}
          </div>

          <div class="mb-4">
            <label class="form-label"> Deskripsi </label>

            {{ form.description }}
          </div>

          <button class="btn btn-success">Simpan</button>
        </form>
      </div>
    </div>
  </div>
</div>

{% endblock %}
